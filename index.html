<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e6de" />

    <!-- Set theme before paint to avoid a flash. Defaults to dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {
          /* default: light */
        }
      })();
    </script>

    <title>Ian Wanjohi — Creative Developer & 3D Web Engineer</title>
    <meta
      name="description"
      content="Ian Wanjohi is a creative developer crafting cinematic, high-performance web experiences with React, Three.js and modern motion design."
    />
    <link rel="canonical" href="https://ianwanjohi.dev/" />
    <meta name="author" content="Ian Wanjohi" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ian Wanjohi — Creative Developer & 3D Web Engineer" />
    <meta
      property="og:description"
      content="Cinematic, animated, performance-obsessed web experiences built with React & Three.js."
    />
    <meta property="og:url" content="https://ianwanjohi.dev/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: preconnect + display swap for good CLS/FCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:ital,wght@0,200..700;1,200..700&family=JetBrains+Mono:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: Person schema for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ian Wanjohi",
        "jobTitle": "Creative Developer & 3D Web Engineer",
        "url": "https://ianwanjohi.dev/",
        "sameAs": [
          "https://github.com/ianwanjohi475",
          "https://www.linkedin.com/in/ianwanjohi"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
